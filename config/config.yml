# Instellingen van de PoolParty-ETL. Uitleg per instelling: docs/configuratie.md.
# Geheimen staan NIET hier maar in omgevingsvariabelen: POOLPARTY_AUTH en TRIPLYDB_TOKEN.

### PoolParty (bron) ###
poolparty:
  # {project} wordt vervangen door de projectcode
  export_url: 'https://data.cultureelerfgoed.nl/PoolParty/api/projects/{project}/export'
  # deze modules komen elk in een eigen named graph: .../thesaurus, .../metadata/void, .../metadata/adms
  modules: ['concepts', 'void', 'adms']
  # seconden per exportverzoek; de CHT (480.000 triples) duurt ongeveer een minuut
  timeout: 900
  # pogingen bij een tijdelijke fout (HTTP 5xx, 429, netwerkfout); wachttijd = backoff x poging
  retries: 4
  backoff: 15

### TriplyDB / Linked Data Voorziening (doel) ###
triplydb:
  url: 'https://api.linkeddata.cultureelerfgoed.nl'
  account: 'thesauri'
  # seconden voor één import-from-file
  import_timeout: 3600
  # seconden wachten tot een service na de sync weer 'running' en bijgewerkt is
  sync_timeout: 1800
  poll_interval: 15
  # het verwerkingsrapport komt onder deze vaste naam als asset bij elke dataset (een nieuwe run vervangt het)
  report_asset: 'etl-rapport.json'

### Kwaliteitsbewaking ###
checks:
  # minimaal aantal skos:Concept in de thesaurusgraph van een project
  min_concepts: 1
  # een export die een graph meer dan dit percentage kleiner maakt dan in de LDV, wordt niet gepubliceerd
  # (beschermt tegen een afgebroken of halve export). Eenmalig omzeilen: --allow-shrink.
  max_shrink_percent: 10
  # na de import moet het aantal statements in de LDV hooguit dit percentage afwijken van de export
  max_import_deviation_percent: 1

### Datasets ###
# Per dataset in account `thesauri`: de PoolParty-projecten die erin komen.
#   project_code  de PoolParty-projectcode (UUID)
#   graph_name    de thesaurusgraph die het project exporteert; moet in de export voorkomen
